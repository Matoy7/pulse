name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            # User/org page: served at the domain root.
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            # Project page: served at https://<owner>.github.io/<repo>/
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GH_PAGES_BASE: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Copy Storybook into dist/storybook
        run: |
          mkdir -p dist/storybook
          cp -r storybook-static/. dist/storybook/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
